name: Suggest an official policy source
description: Submit a terms or privacy link for maintainer review, not automated policy analysis.
title: "Policy source: "
labels: ["policy-submission"]
body:
  - type: markdown
    attributes:
      value: |
        This issue is public. Do not include secrets, personal information, confidential material, or full policies.
        Choose an existing catalog service by slug (for example github, youtube, instagram, chatgpt, amazon).
        A maintainer may add policy-accepted to create an unverified source-candidate draft PR. It does not publish a review.
  - type: input
    id: service
    attributes:
      label: Service
      description: Existing catalog service slug; use the website form to prefill it.
      placeholder: github
    validations:
      required: true
  - type: dropdown
    id: kind
    attributes:
      label: Policy type
      options: [terms, privacy]
    validations:
      required: true
  - type: input
    id: policy-url
    attributes:
      label: Policy URL
      description: Official public HTTPS URL, without credentials or tracking tokens.
    validations:
      required: true
  - type: dropdown
    id: region
    attributes:
      label: Applicable region
      description: Choose Unknown if the source does not clearly establish United States applicability.
      options: [Unknown, United States]
    validations:
      required: true
  - type: checkboxes
    id: confirmation
    attributes:
      label: Confirmation
      options:
        - label: I understand submissions are public and are not automatically reviewed or published.
          required: true
