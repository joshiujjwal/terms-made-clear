name: Accepted policy source

on:
  issues:
    types: [labeled]

permissions:
  contents: read

concurrency:
  group: policy-intake-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  draft:
    if: github.event.label.name == 'policy-accepted' && !github.event.issue.pull_request
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Validate accepted issue and create draft source PR
        run: node --import tsx scripts/policy-intake.ts
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
